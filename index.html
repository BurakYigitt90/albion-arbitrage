<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Market & Black Market Arbitraj</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin-bottom: 20px; color: #ffa726; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select, button, input { padding: 10px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { background: #d32f2f; cursor: pointer; font-weight: bold; }
        button:hover { background: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 13px; }
        th { background: #252525; color: #ffa726; }
        .profit { color: #66bb6a; font-weight: bold; }
        .loss { color: #ef5350; }
        .loading { text-align: center; padding: 20px; font-style: italic; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>Albion Arbitraj Takip Panosu (Enchantment & Kalite Destekli)</h1>
    
    <div class="controls">
        <div>
            <label>Alış Yeri:</label>
            <select id="sourceCity">
                <option value="Caerleon">Caerleon (Normal Market)</option>
                <option value="Martlock">Martlock</option>
                <option value="Bridgewatch">Bridgewatch</option>
                <option value="Lymhurst">Lymhurst</option>
                <option value="Thetford">Thetford</option>
                <option value="Fort Sterling">Fort Sterling</option>
            </select>
        </div>
        
        <div>
            <label>Satış Yeri:</label>
            <select id="targetCity">
                <option value="Black Market">Caerleon Black Market</option>
                <option value="Caerleon">Caerleon (Normal Market)</option>
            </select>
        </div>

        <div>
            <label>Min Kalite:</label>
            <select id="minQuality">
                <option value="1">1 - Normal ve Üstü</option>
                <option value="2">2 - İyi (Good) ve Üstü</option>
                <option value="3">3 - Kaliteli (Outstanding)+</option>
                <option value="4">4 - Mükemmel (Excellent)+</option>
                <option value="5">5 - Sadece Başyapıt (Masterpiece)</option>
            </select>
        </div>

        <div>
            <label>Premium:</label>
            <select id="isPremium">
                <option value="true">Var (-%4 Vergi)</option>
                <option value="false">Yok (-%8 Vergi)</option>
            </select>
        </div>

        <div style="align-self: flex-end;">
            <button onclick="fetchArbitrageData()">Analiz Et</button>
        </div>
    </div>

    <div id="status"></div>

    <table>
        <thead>
            <tr>
                <th>Item ID</th>
                <th>Kalite</th>
                <th>Alış (Kaynak)</th>
                <th>Satış (Hedef)</th>
                <th>Vergi</th>
                <th>Net Kâr</th>
                <th>Marj (%)</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <tr><td colspan="7" class="loading">Henüz veri çekilmedi kanka. Butona bas bekliyorum.</td></tr>
        </tbody>
    </table>
</div>

<script>
    // @1 (.1 enchantment), @2 (.2 enchantment) şeklinde güncelledik
    const sampleItems = [
        "T4_MAIN_SWORD", "T4_MAIN_SWORD@1", "T4_MAIN_SWORD@2",
        "T5_MAIN_SWORD", "T5_MAIN_SWORD@1", 
        "T4_2H_BOW", "T4_2H_BOW@1", "T4_2H_BOW@2",
        "T5_2H_BOW", "T5_2H_BOW@1",
        "T4_ARMOR_PLATE_SET3", "T4_ARMOR_PLATE_SET3@1",
        "T5_ARMOR_PLATE_SET3", "T5_ARMOR_PLATE_SET3@1",
        "T4_BAG", "T4_BAG@1", "T4_BAG@2", "T5_BAG", "T5_BAG@1"
    ];

    const qualityNames = {
        1: "Normal",
        2: "İyi",
        3: "Kaliteli",
        4: "Mükemmel",
        5: "Başyapıt"
    };

    async function fetchArbitrageData() {
        const source = document.getElementById('sourceCity').value;
        const target = document.getElementById('targetCity').value;
        const minQuality = parseInt(document.getElementById('minQuality').value);
        const premium = document.getElementById('isPremium').value === 'true';
        const tbody = document.getElementById('resultBody');

        tbody.innerHTML = `<tr><td colspan="7" class="loading">Albion API'den veriler taranıyor, bekle kankam...</td></tr>`;

        try {
            const itemsString = sampleItems.join(',');
            const url = `https://west.albion-online-data.com/api/v2/stats/prices/${itemsString}?locations=${source},${target}`;
            
            const response = await fetch(url);
            const data = await response.json();

            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading">Veri bulunamadı.</td></tr>`;
                return;
            }

            // Verileri "item_id_kalite" anahtarıyla gruplayacağız çünkü her kalitenin fiyatı ayrıdır
            let marketMap = {};
            data.forEach(row => {
                let key = `${row.item_id}_${row.quality}`;
                if (!marketMap[key]) marketMap[key] = {};
                marketMap[key][row.city] = row;
            });

            let foundCount = 0;

            for (let key of Object.keys(marketMap)) {
                let parts = key.split('_');
                let quality = parseInt(parts.pop()); // Son parça kalitedir
                let itemId = parts.join('_'); // Geri kalanı item ID (örn: T4_MAIN_SWORD@1)

                // Kalite filtrelemesi
                if (quality < minQuality) continue;

                let itemData = marketMap[key];
                if (!itemData[source] || !itemData[target]) continue;

                let buyRecord = itemData[source];
                let sellRecord = itemData[target];

                let buyPrice = buyRecord.sell_price_min;
                let sellPrice = target === 'Black Market' ? sellRecord.buy_price_max : sellRecord.sell_price_min;

                if (buyPrice === 0 || sellPrice === 0) continue;

                let taxRate = premium ? 0.04 : 0.08;
                let taxAmount = sellPrice * taxRate;
                let netProfit = sellPrice - buyPrice - taxAmount;
                let profitMargin = (netProfit / buyPrice) * 100;

                let rowClass = netProfit > 0 ? "profit" : "loss";
                foundCount++;

                tbody.innerHTML += `
                    <tr>
                        <td><b>${itemId}</b></td>
                        <td>${qualityNames[quality] || quality}</td>
                        <td>${buyPrice.toLocaleString()} s</td>
                        <td>${sellPrice.toLocaleString()} s</td>
                        <td>${taxAmount.toFixed(0)} s</td>
                        <td class="${rowClass}">${netProfit.toFixed(0)} s</td>
                        <td class="${rowClass}">${profitMargin.toFixed(1)}%</td>
                    </tr>
                `;
            }

            if(foundCount === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading">Seçilen kriterlere uygun karlı veya aktif veri bulunamadı kanka.</td></tr>`;
            }

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `<tr><td colspan="7" class="loading" style="color: #ef5350;">API'den veri çekerken hata oluştu kanka!</td></tr>`;
        }
    }
</script>

</body>
</html>
