<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Otomatik Arbitraj Tarayıcısı</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin-bottom: 20px; color: #ffa726; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        select, button { padding: 10px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
        button { background: #d32f2f; cursor: pointer; font-weight: bold; }
        button:hover { background: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 13px; }
        th { background: #252525; color: #ffa726; }
        .profit { color: #66bb6a; font-weight: bold; }
        .loss { color: #ef5350; }
        .loading { text-align: center; padding: 20px; font-style: italic; color: #888; }
        .item-name { color: #4fc3f7; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Albion Otomatik En Karlı 20 Arbitraj Fırsatı</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>Alış Yeri (Kaynak Market):</label>
            <select id="sourceCity">
                <option value="Martlock">Martlock</option>
                <option value="Bridgewatch">Bridgewatch</option>
                <option value="Lymhurst">Lymhurst</option>
                <option value="Thetford">Thetford</option>
                <option value="Fort Sterling">Fort Sterling</option>
                <option value="Caerleon">Caerleon (Normal Market)</option>
                <option value="Brecilian">Brecilian</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Satış Yeri (Hedef Market):</label>
            <select id="targetCity">
                <option value="Black Market">Caerleon Black Market</option>
                <option value="Caerleon">Caerleon (Normal Market)</option>
                <option value="Martlock">Martlock</option>
                <option value="Bridgewatch">Bridgewatch</option>
                <option value="Lymhurst">Lymhurst</option>
                <option value="Thetford">Thetford</option>
                <option value="Fort Sterling">Fort Sterling</option>
                <option value="Brecilian">Brecilian</option>
            </select>
        </div>

        <div class="control-group">
            <label>Taranacak Tier:</label>
            <select id="itemTier">
                <option value="T4">Tier 4 (T4)</option>
                <option value="T5" selected>Tier 5 (T5)</option>
                <option value="T6">Tier 6 (T6)</option>
                <option value="T7">Tier 7 (T7)</option>
                <option value="T8">Tier 8 (T8)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Premium:</label>
            <select id="isPremium">
                <option value="true">Var (-%4 Vergi)</option>
                <option value="false">Yok (-%8 Vergi)</option>
            </select>
        </div>

        <div>
            <button onclick="runAutoScanner()">En Karlı 20'yi Bul</button>
        </div>
    </div>

    <div id="status"></div>

    <table>
        <thead>
            <tr>
                <th>Sıra</th>
                <th>Item ID & Enchant</th>
                <th>Kalite</th>
                <th>Alış Fiyatı</th>
                <th>Satış Fiyatı</th>
                <th>Vergi</th>
                <th>Net Kâr</th>
                <th>Marj (%)</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <tr><td colspan="8" class="loading">Pazarları taramak için butona bas kankam.</td></tr>
        </tbody>
    </table>
</div>

<script>
    const qualityNames = {
        1: "Normal",
        2: "İyi",
        3: "Kaliteli",
        4: "Mükemmel",
        5: "Başyapıt"
    };

    // Genişletilmiş Master Veritabanı Havuzu (Tüm ana kategorileri kapsayan kalıplar)
    function getMasterItemList(tier) {
        let rawTypes = [
            // Çanta & Pelerin
            "BAG", "CAPE",
            // Silahlar
            "SWORD", "2H_DUALSWORD", "2H_CLAYMORE", "2H_BOW", "2H_WARBOW", 
            "MAIN_AXE", "2H_AXE", "2H_HALBERD", "MAIN_HAMMER", "2H_HAMMER",
            "2H_CROSSBOW", "MAIN_FIRESTAFF", "2H_FIRESTAFF", "MAIN_HOLYSTAFF", "2H_HOLYSTAFF",
            // Zırhlar (Plate, Leather, Cloth)
            "ARMOR_PLATE_SET1", "ARMOR_PLATE_SET2", "ARMOR_PLATE_SET3",
            "HEAD_PLATE_SET1", "HEAD_PLATE_SET2", "HEAD_PLATE_SET3",
            "SHOES_PLATE_SET1", "SHOES_PLATE_SET2", "SHOES_PLATE_SET3",
            "ARMOR_LEATHER_SET1", "ARMOR_LEATHER_SET2", "ARMOR_LEATHER_SET3",
            "HEAD_LEATHER_SET1", "HEAD_LEATHER_SET2", "HEAD_LEATHER_SET3",
            "SHOES_LEATHER_SET1", "SHOES_LEATHER_SET2", "SHOES_LEATHER_SET3",
            "ARMOR_CLOTH_SET1", "ARMOR_CLOTH_SET2", "ARMOR_CLOTH_SET3",
            "HEAD_CLOTH_SET1", "HEAD_CLOTH_SET2", "HEAD_CLOTH_SET3",
            "SHOES_CLOTH_SET1", "SHOES_CLOTH_SET2", "SHOES_CLOTH_SET3",
            // Toplayıcılık ve Balıkçılık
            "FISHINGROD", "ARMOR_FISHING", "HEAD_FISHING", "SHOES_FISHING",
            "ARMOR_GATHERER_FIBER", "HEAD_GATHERER_FIBER", "SHOES_GATHERER_FIBER",
            "ARMOR_GATHERER_HIDE", "HEAD_GATHERER_HIDE", "SHOES_GATHERER_HIDE",
            "ARMOR_GATHERER_ORE", "HEAD_GATHERER_ORE", "SHOES_GATHERER_ORE",
            // Potlar
            "POTION_HEAL", "POTION_ENERGY", "POTION_STONESKIN"
        ];

        let list = [];
        rawTypes.forEach(type => {
            let base = `${tier}_${type}`;
            list.push(base);         // .0
            list.push(`${base}@1`);  // .1
            list.push(`${base}@2`);  // .2
            list.push(`${base}@3`);  // .3
        });
        return list;
    }

    // API URL karakter sınırına takılmamak için diziyi küçük parçalara (chunk) bölen yardımcı fonksiyon
    function chunkArray(array, size) {
        let result = [];
        for (let value of array) {
            let lastGroup = result[result.length - 1];
            if (!lastGroup || lastGroup.length === size) {
                result.push([value]);
            } else {
                lastGroup.push(value);
            }
        }
        return result;
    }

    async function runAutoScanner() {
        const source = document.getElementById('sourceCity').value;
        const target = document.getElementById('targetCity').value;
        const tier = document.getElementById('itemTier').value;
        const premium = document.getElementById('isPremium').value === 'true';
        const tbody = document.getElementById('resultBody');
        const statusDiv = document.getElementById('status');

        if (source === target) {
            alert("Alış ve Satış yeri aynı olamaz kanka!");
            return;
        }

        tbody.innerHTML = `<tr><td colspan="8" class="loading">Albion pazarları taranıyor, en karlı fırsatlar hesaplanıyor... Bekle kankam.</td></tr>`;
        statusDiv.innerHTML = "";

        let allItems = getMasterItemList(tier);
        let chunks = chunkArray(allItems, 40); // URL çok uzun olmasın diye 40'ar gruplar halinde sorgulayacağız
        let masterResults = [];

        try {
            for (let i = 0; i < chunks.length; i++) {
                statusDiv.innerHTML = `Tarama ilerlemesi: Grup ${i + 1} / ${chunks.length} taranıyor...`;
                let itemsString = chunks[i].join(',');
                let url = `https://west.albion-online-data.com/api/v2/stats/prices/${itemsString}?locations=${source},${target}`;
                
                let response = await fetch(url);
                let data = await response.json();

                if (data && data.length > 0) {
                    let marketMap = {};
                    data.forEach(row => {
                        let key = `${row.item_id}_${row.quality}`;
                        if (!marketMap[key]) marketMap[key] = {};
                        marketMap[key][row.city] = row;
                    });

                    for (let key of Object.keys(marketMap)) {
                        let parts = key.split('_');
                        let quality = parseInt(parts.pop());
                        let itemId = parts.join('_');

                        let itemData = marketMap[key];
                        if (!itemData[source] || !itemData[target]) continue;

                        let buyRecord = itemData[source];
                        let sellRecord = itemData[target];

                        // Kaynaktan en ucuz fiyata al (sell_price_min)
                        let buyPrice = buyRecord.sell_price_min;
                        // Hedef Black Market ise alım teklifi (buy_price_max), diğer şehirler ise satış emri (sell_price_min)
                        let sellPrice = target === 'Black Market' ? sellRecord.buy_price_max : sellRecord.sell_price_min;

                // Anlamsız sıfır veya negatif fiyatları ve geçersiz verileri ele
                if (buyPrice <= 0 || sellPrice <= 0 || sellPrice <= buyPrice) continue;

                        let taxRate = premium ? 0.04 : 0.08;
                        let taxAmount = sellPrice * taxRate;
                        let netProfit = sellPrice - buyPrice - taxAmount;
                        
                        // Sadece gerçekten karda olanları alalım
                        if (netProfit <= 0) continue;

                        let profitMargin = (netProfit / buyPrice) * 100;

                        masterResults.push({
                            itemId,
                            quality: qualityNames[quality] || quality,
                            buyPrice,
                            sellPrice,
                            taxAmount,
                            netProfit,
                            profitMargin
                        });
                    }
                }
            }

            statusDiv.innerHTML = "";
            tbody.innerHTML = "";

            if (masterResults.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="loading">Bu kriterlerde karlı arbitraj fırsatı bulunamadı kanka. Başka bir tier veya şehir dene.</td></tr>`;
                return;
            }

            // En yüksek net kâra göre büyükten küçüğe sırala
            masterResults.sort((a, b) => b.netProfit - a.netProfit);

            // Sadece ilk 20 fırsatı al
            let top20 = masterResults.slice(0, 20);

            top20.forEach((res, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>#${index + 1}</b></td>
                        <td class="item-name">${res.itemId}</td>
                        <td>${res.quality}</td>
                        <td>${res.buyPrice.toLocaleString()} s</td>
                        <td>${res.sellPrice.toLocaleString()} s</td>
                        <td>${res.taxAmount.toFixed(0)} s</td>
                        <td class="profit">${res.netProfit.toLocaleString()} s</td>
                        <td class="profit">%${res.profitMargin.toFixed(1)}</td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `<tr><td colspan="8" class="loading" style="color: #ef5350;">Veri çekerken hata oluştu kanka! Konsola bak.</td></tr>`;
        }
    }
</script>

</body>
</html>
