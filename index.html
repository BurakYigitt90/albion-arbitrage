<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Master Arbitraj Terminali</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin-bottom: 20px; color: #ffa726; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        select, button { padding: 10px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
        button { background: #d32f2f; cursor: pointer; font-weight: bold; }
        button:hover { background: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 12px; }
        th { background: #252525; color: #ffa726; }
        .profit { color: #66bb6a; font-weight: bold; }
        .loading { text-align: center; padding: 20px; font-style: italic; color: #888; }
        .item-name { color: #4fc3f7; font-weight: bold; }
        .stale { color: #ef5350; font-size: 11px; }
        .fresh { color: #66bb6a; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Albion En Karlı 20 Arbitraj Fırsatı</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>Alış Yeri (Kaynak):</label>
            <select id="sourceCity">
                <option value="Martlock">Martlock</option>
                <option value="Bridgewatch">Bridgewatch</option>
                <option value="Lymhurst">Lymhurst</option>
                <option value="Thetford">Thetford</option>
                <option value="Fort Sterling">Fort Sterling</option>
                <option value="Caerleon">Caerleon (Normal Market)</option>
                <option value="Brecilian">Brecilian</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Satış Yeri (Hedef):</label>
            <select id="targetCity">
                <option value="Black Market" selected>Caerleon Black Market</option>
                <option value="Caerleon">Caerleon (Normal Market)</option>
                <option value="Martlock">Martlock</option>
                <option value="Bridgewatch">Bridgewatch</option>
                <option value="Lymhurst">Lymhurst</option>
                <option value="Thetford">Thetford</option>
                <option value="Fort Sterling">Fort Sterling</option>
                <option value="Brecilian">Brecilian</option>
            </select>
        </div>

        <div class="control-group">
            <label>Taranacak Tier Aralığı:</label>
            <select id="itemTier">
                <option value="T4,T5">Tier 4 ve Tier 5 (Hızlı)</option>
                <option value="T4,T5,T6" selected>Tier 4, 5, 6 (Önerilen)</option>
                <option value="T4,T5,T6,T7,T8">Tüm Tier'lar (T4 - T8)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Premium:</label>
            <select id="isPremium">
                <option value="true">Var (-%4 Vergi)</option>
                <option value="false">Yok (-%8 Vergi)</option>
            </select>
        </div>

        <div>
            <button onclick="runMasterScanner()">En Karlı 20'yi Bul</button>
        </div>
    </div>

    <div id="status"></div>

    <table>
        <thead>
            <tr>
                <th>Sıra</th>
                <th>Item Name</th>
                <th>Tier</th>
                <th>Enchant</th>
                <th>Quality</th>
                <th>Buying Price</th>
                <th>Selling Price</th>
                <th>Profit (Net)</th>
                <th>Margin</th>
                <th>Veri Zamanı</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <tr><td colspan="10" class="loading">Pazarları taramak için butona bas kankam.</td></tr>
        </tbody>
    </table>
</div>

<script>
    // ID'leri kullanıcı dostu İngilizce isimlere çeviren sözlük
    const itemNameMap = {
        "BAG": "Bag", "CAPE": "Cape",
        "SWORD": "Broadsword", "2H_DUALSWORD": "Dual Swords", "2H_CLAYMORE": "Claymore",
        "2H_BOW": "Bow", "2H_WARBOW": "Warbow", "2H_LONGBOW": "Longbow",
        "MAIN_AXE": "Battleaxe", "2H_AXE": "Greataxe", "2H_HALBERD": "Halberd",
        "MAIN_HAMMER": "Hammer", "2H_HAMMER": "Great Hammer",
        "2H_CROSSBOW": "Crossbow", "2H_CROSSBOW_LARGE": "Heavy Crossbow",
        "MAIN_FIRESTAFF": "Fire Staff", "2H_FIRESTAFF": "Great Fire Staff",
        "MAIN_HOLYSTAFF": "Holy Staff", "2H_HOLYSTAFF": "Great Holy Staff",
        "ARMOR_PLATE_SET1": "Knight Armor", "ARMOR_PLATE_SET2": "Footman Armor", "ARMOR_PLATE_SET3": "Soldier Armor",
        "HEAD_PLATE_SET1": "Knight Helmet", "HEAD_PLATE_SET2": "Footman Helmet", "HEAD_PLATE_SET3": "Soldier Helmet",
        "SHOES_PLATE_SET1": "Knight Boots", "SHOES_PLATE_SET2": "Footman Boots", "SHOES_PLATE_SET3": "Soldier Boots",
        "ARMOR_LEATHER_SET1": "Stalker Jacket", "ARMOR_LEATHER_SET2": "Mercenary Jacket", "ARMOR_LEATHER_SET3": "Hunter Jacket",
        "HEAD_LEATHER_SET1": "Stalker Hood", "HEAD_LEATHER_SET2": "Mercenary Hood", "HEAD_LEATHER_SET3": "Hunter Hood",
        "SHOES_LEATHER_SET1": "Stalker Shoes", "SHOES_LEATHER_SET2": "Mercenary Shoes", "SHOES_LEATHER_SET3": "Hunter Shoes",
        "ARMOR_CLOTH_SET1": "Scholar Robe", "ARMOR_CLOTH_SET2": "Cleric Robe", "ARMOR_CLOTH_SET3": "Mage Robe",
        "HEAD_CLOTH_SET1": "Scholar Cowl", "HEAD_CLOTH_SET2": "Cleric Cowl", "HEAD_CLOTH_SET3": "Mage Cowl",
        "SHOES_CLOTH_SET1": "Scholar Sandals", "SHOES_CLOTH_SET2": "Cleric Sandals", "SHOES_CLOTH_SET3": "Mage Sandals",
        "FISHINGROD": "Fishing Rod", "ARMOR_FISHING": "Fisherman Garb", "HEAD_FISHING": "Fisherman Cap", "SHOES_FISHING": "Fisherman Boots",
        "POTION_HEAL": "Healing Potion", "POTION_ENERGY": "Energy Potion", "POTION_STONESKIN": "Stoneskin Potion"
    };

    const qualityNames = {
        1: "Normal",
        2: "Good",
        3: "Outstanding",
        4: "Excellent",
        5: "Masterpiece"
    };

    function parseItemCode(rawId) {
        // Örn: T5_SWORD@2 -> Tier: T5, Base: SWORD, Enchant: .2
        let enchant = ".0";
        let cleanId = rawId;
        if (rawId.includes("@")) {
            let parts = rawId.split("@");
            cleanId = parts[0];
            enchant = "." + parts[1];
        }

        let tier = cleanId.substring(0, 2); // T4, T5 vb.
        let typeKey = cleanId.substring(3); // Kalan kısım (SWORD, BAG vb.)

        let readableName = itemNameMap[typeKey] || typeKey;
        return { readableName, tier, enchant };
    }

    function getMasterItemList(tiersStr) {
        let tiers = tiersStr.split(',');
        let rawTypes = Object.keys(itemNameMap);
        let list = [];

        tiers.forEach(tier => {
            rawTypes.forEach(type => {
                let base = `${tier}_${type}`;
                list.push(base);
                list.push(`${base}@1`);
                list.push(`${base}@2`);
                list.push(`${base}@3`);
            });
        });
        return list;
    }

    function chunkArray(array, size) {
        let result = [];
        for (let value of array) {
            let lastGroup = result[result.length - 1];
            if (!lastGroup || lastGroup.length === size) {
                result.push([value]);
            } else {
                lastGroup.push(value);
            }
        }
        return result;
    }

    async function runMasterScanner() {
        const source = document.getElementById('sourceCity').value;
        const target = document.getElementById('targetCity').value;
        const tiersStr = document.getElementById('itemTier').value;
        const premium = document.getElementById('isPremium').value === 'true';
        const tbody = document.getElementById('resultBody');
        const statusDiv = document.getElementById('status');

        if (source === target) {
            alert("Alış ve Satış yeri aynı olamaz kanka!");
            return;
        }

        tbody.innerHTML = `<tr><td colspan="10" class="loading">Pazarlar taranıyor, en karlı 20 fırsat ayıklanıyor... Bekle kankam.</td></tr>`;
        statusDiv.innerHTML = "";

        let allItems = getMasterItemList(tiersStr);
        let chunks = chunkArray(allItems, 35);
        let masterResults = [];

        try {
            for (let i = 0; i < chunks.length; i++) {
                statusDiv.innerHTML = `Tarama ilerlemesi: Parça ${i + 1} / ${chunks.length} işleniyor...`;
                let itemsString = chunks[i].join(',');
                let url = `https://west.albion-online-data.com/api/v2/stats/prices/${itemsString}?locations=${source},${target}`;
                
                let response = await fetch(url);
                let data = await response.json();

                if (data && data.length > 0) {
                    let marketMap = {};
                    data.forEach(row => {
                        let key = `${row.item_id}_${row.quality}`;
                        if (!marketMap[key]) marketMap[key] = {};
                        marketMap[key][row.city] = row;
                    });

                    for (let key of Object.keys(marketMap)) {
                        let parts = key.split('_');
                        let quality = parseInt(parts.pop());
                        let itemId = parts.join('_');

                        let itemData = marketMap[key];
                        if (!itemData[source] || !itemData[target]) continue;

                        let buyRecord = itemData[source];
                        let sellRecord = itemData[target];

                        let buyPrice = buyRecord.sell_price_min;
                        let sellPrice = target === 'Black Market' ? sellRecord.buy_price_max : sellRecord.sell_price_min;

                        if (buyPrice <= 0 || sellPrice <= 0 || sellPrice <= buyPrice) continue;

                        let taxRate = premium ? 0.04 : 0.08;
                        let taxAmount = sellPrice * taxRate;
                        let netProfit = sellPrice - buyPrice - taxAmount;

                        if (netProfit <= 0) continue;

                        let profitMargin = (netProfit / buyPrice) * 100;

                        // Verinin sisteme girilme zamanını alalım (Kaynak veya Hedef marketten en güncel olanı)
                        let timeStr = buyRecord.updated > sellRecord.updated ? buyRecord.updated : sellRecord.updated;

                        let parsed = parseItemCode(itemId);

                        masterResults.push({
                            readableName: parsed.readableName,
                            tier: parsed.tier,
                            enchant: parsed.enchant,
                            quality: qualityNames[quality] || quality,
                            buyPrice,
                            sellPrice,
                            netProfit,
                            profitMargin,
                            updated: timeStr
                        });
                    }
                }
            }

            statusDiv.innerHTML = "";
            tbody.innerHTML = "";

            if (masterResults.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="loading">Bu kriterlerde karlı arbitraj fırsatı bulunamadı kanka.</td></tr>`;
                return;
            }

            // En yüksek net kâra göre büyükten küçüğe sırala ve ilk 20'yi al
            masterResults.sort((a, b) => b.netProfit - a.netProfit);
            let top20 = masterResults.slice(0, 20);

            top20.forEach((res, index) => {
                // Zamanı okunabilir formata çevirelim (kaç saat/dakika önce)
                let updateTimeText = "Bilinmiyor";
                if (res.updated && res.updated !== "0001-01-01T00:00:00") {
                    let updateDate = new Date(res.updated);
                    let now = new Date();
                    let diffHours = Math.floor((now - updateDate) / (1000 * 60 * 60));
                    if (diffHours < 1) {
                        let diffMins = Math.floor((now - updateDate) / (1000 * 60));
                        updateTimeText = `${diffMins} dk önce`;
                    } else if (diffHours < 24) {
                        updateTimeText = `${diffHours} sa önce`;
                    } else {
                        let diffDays = Math.floor(diffHours / 24);
                        updateTimeText = `${diffDays} gün önce`;
                    }
                }

                tbody.innerHTML += `
                    <tr>
                        <td><b>#${index + 1}</b></td>
                        <td class="item-name">${res.readableName}</td>
                        <td><b>${res.tier}</b></td>
                        <td>${res.enchant}</td>
                        <td>${res.quality}</td>
                        <td>${res.buyPrice.toLocaleString()} s</td>
                        <td>${res.sellPrice.toLocaleString()} s</td>
                        <td class="profit">${res.netProfit.toLocaleString()} s</td>
                        <td class="profit">%${res.profitMargin.toFixed(1)}</td>
                        <td>${updateTimeText}</td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `<tr><td colspan="10" class="loading" style="color: #ef5350;">Veri çekerken hata oluştu kanka!</td></tr>`;
        }
    }
</script>

</body>
</html>
