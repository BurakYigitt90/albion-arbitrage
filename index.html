<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Profesyonel Arbitraj Panosu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin-bottom: 20px; color: #ffa726; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        select, button { padding: 10px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
        button { background: #d32f2f; cursor: pointer; font-weight: bold; }
        button:hover { background: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 13px; }
        th { background: #252525; color: #ffa726; }
        .profit { color: #66bb6a; font-weight: bold; }
        .loss { color: #ef5350; }
        .loading { text-align: center; padding: 20px; font-style: italic; color: #888; }
        .item-name { color: #4fc3f7; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Albion Profesyonel Arbitraj Panosu</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>Alış Yeri (Kaynak):</label>
            <select id="sourceCity">
                <option value="Caerleon">Caerleon (Normal Market)</option>
                <option value="Martlock">Martlock</option>
                <option value="Bridgewatch">Bridgewatch</option>
                <option value="Lymhurst">Lymhurst</option>
                <option value="Thetford">Thetford</option>
                <option value="Fort Sterling">Fort Sterling</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Satış Yeri (Hedef):</label>
            <select id="targetCity">
                <option value="Black Market">Caerleon Black Market</option>
                <option value="Caerleon">Caerleon (Normal Market)</option>
                <option value="Martlock">Martlock</option>
            </select>
        </div>

        <div class="control-group">
            <label>İtem:</label>
            <select id="baseItem" style="width: 180px;">
                <optgroup label="Çantalar">
                    <option value="T4_BAG">T4 Çanta</option>
                    <option value="T5_BAG">T5 Çanta</option>
                    <option value="T6_BAG">T6 Çanta</option>
                </optgroup>
                <optgroup label="Silahlar">
                    <option value="T4_SWORD">Broadsword (T4 Kılıç)</option>
                    <option value="T5_SWORD">Broadsword (T5 Kılıç)</option>
                    <option value="T4_2H_DUALSWORD">Dual Swords (T4)</option>
                    <option value="T5_2H_DUALSWORD">Dual Swords (T5)</option>
                    <option value="T4_2H_BOW">Bow (T4 Yay)</option>
                    <option value="T5_2H_BOW">Bow (T5 Yay)</option>
                </optgroup>
                <optgroup label="Zırhlar">
                    <option value="T4_ARMOR_PLATE_SET3">Soldier Armor (T4)</option>
                    <option value="T5_ARMOR_PLATE_SET3">Soldier Armor (T5)</option>
                </optgroup>
            </select>
        </div>

        <div class="control-group">
            <label>Enchantment:</label>
            <select id="enchantLevel">
                <option value="">.0 (Düz)</option>
                <option value="@1">.1 (Yeşil)</option>
                <option value="@2">.2 (Mavi)</option>
                <option value="@3">.3 (Mor)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Kalite:</label>
            <select id="qualityLevel">
                <option value="all">Tüm Kaliteler</option>
                <option value="1">Normal</option>
                <option value="2">İyi (Good)</option>
                <option value="3">Kaliteli (Outstanding)</option>
                <option value="4">Mükemmel (Excellent)</option>
                <option value="5">Başyapıt (Masterpiece)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Premium:</label>
            <select id="isPremium">
                <option value="true">Var (-%4 Vergi)</option>
                <option value="false">Yok (-%8 Vergi)</option>
            </select>
        </div>

        <div>
            <button onclick="fetchArbitrageData()">Fiyatları Çek</button>
        </div>
    </div>

    <div id="status"></div>

    <table>
        <thead>
            <tr>
                <th>Item ID</th>
                <th>Kalite</th>
                <th>Alış Fiyatı</th>
                <th>Satış Fiyatı</th>
                <th>Vergi</th>
                <th>Net Kâr</th>
                <th>Marj (%)</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <tr><td colspan="7" class="loading">Seçimleri yapıp "Fiyatları Çek" butonuna bas kankam.</td></tr>
        </tbody>
    </table>
</div>

<script>
    const qualityNames = {
        1: "Normal",
        2: "İyi",
        3: "Kaliteli",
        4: "Mükemmel",
        5: "Başyapıt"
    };

    async function fetchArbitrageData() {
        const source = document.getElementById('sourceCity').value;
        const target = document.getElementById('targetCity').value;
        const baseItem = document.getElementById('baseItem').value;
        const enchant = document.getElementById('enchantLevel').value;
        const targetQuality = document.getElementById('qualityLevel').value;
        const premium = document.getElementById('isPremium').value === 'true';
        const tbody = document.getElementById('resultBody');

        // Tam item ID'sini oluştur (Örn: T4_SWORD@1)
        const finalItemId = baseItem + enchant;

        tbody.innerHTML = `<tr><td colspan="7" class="loading">API'den veriler süzülüyor, bekle kankam...</td></tr>`;

        try {
            const url = `https://west.albion-online-data.com/api/v2/stats/prices/${finalItemId}?locations=${source},${target}`;
            
            const response = await fetch(url);
            const data = await response.json();

            tbody.innerHTML = "";

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading">Bu kriterlere uygun veri bulunamadı.</td></tr>`;
                return;
            }

            let marketMap = {};
            data.forEach(row => {
                let key = `${row.item_id}_${row.quality}`;
                if (!marketMap[key]) marketMap[key] = {};
                marketMap[key][row.city] = row;
            });

            let rowCount = 0;

            for (let key of Object.keys(marketMap)) {
                let parts = key.split('_');
                let quality = parseInt(parts.pop());
                let itemId = parts.join('_');

                // Kalite filtresi seçildiyse sadece o kaliteyi göster
                if (targetQuality !== "all" && quality !== parseInt(targetQuality)) continue;

                let itemData = marketMap[key];
                if (!itemData[source] || !itemData[target]) continue;

                let buyRecord = itemData[source];
                let sellRecord = itemData[target];

                let buyPrice = buyRecord.sell_price_min;
                let sellPrice = target === 'Black Market' ? sellRecord.buy_price_max : sellRecord.sell_price_min;

                if (buyPrice <= 0 || sellPrice <= 0) continue;

                let taxRate = premium ? 0.04 : 0.08;
                let taxAmount = sellPrice * taxRate;
                let netProfit = sellPrice - buyPrice - taxAmount;
                let profitMargin = (netProfit / buyPrice) * 100;

                let rowClass = netProfit > 0 ? "profit" : "loss";
                rowCount++;

                tbody.innerHTML += `
                    <tr>
                        <td class="item-name">${itemId}</td>
                        <td>${qualityNames[quality] || quality}</td>
                        <td>${buyPrice.toLocaleString()} s</td>
                        <td>${sellPrice.toLocaleString()} s</td>
                        <td>${taxAmount.toFixed(0)} s</td>
                        <td class="${rowClass}">${netProfit.toFixed(0)} s</td>
                        <td class="${rowClass}">${profitMargin.toFixed(1)}%</td>
                    </tr>
                `;
            }

            if(rowCount === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading">Seçilen kalite veya pazarlarda aktif fiyat verisi bulunamadı kanka.</td></tr>`;
            }

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `<tr><td colspan="7" class="loading" style="color: #ef5350;">Bağlantı hatası oluştu kanka!</td></tr>`;
        }
    }
</script>

</body>
</html>
